name: Settle missing or changed hats

on:
  push:
    branches:
      - main
      - claude/shetland-wool-week-tracker-u20lz7
    paths:
      - "src/data/hats/**"
      - "src/knitting/**"
      - "src/ChainModel/**"
      - "src/helpers/settling.ts"
      - "src/types/**"
      - "src/constants.ts"
      - "package-lock.json"
      - "scripts/settle*.mjs"
      - ".github/workflows/settle-missing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: settle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check all pattern sizes and source fingerprints
        id: plan
        run: |
          if node scripts/settlement-plan.mjs --check; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        if: steps.plan.outputs.needed == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.plan.outputs.needed == 'true'
      - run: npm run settle -- --changed
        if: steps.plan.outputs.needed == 'true'
      - name: Verify every size
        run: npx vitest run src/data/hats/settled/settled.test.ts
      - name: Commit settled positions
        id: commit
        if: steps.plan.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hats/settled/*.json scripts/settlement-manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh settled geometry for changed patterns and sizes"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed source
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"

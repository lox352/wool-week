name: Settle missing hats

on:
  push:
    branches:
      - claude/shetland-wool-week-tracker-u20lz7
    paths:
      - "src/data/hats/*.charts.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: settle-missing
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find hats without settled geometry
        id: missing
        shell: bash
        run: |
          hats="$(node --input-type=module <<'NODE'
          import { readdirSync } from "node:fs";
          const charts = readdirSync("src/data/hats")
            .filter((name) => name.endsWith(".charts.json"))
            .map((name) => name.replace(".charts.json", ""))
            .sort();
          const settled = new Set(
            readdirSync("src/data/hats/settled")
              .filter((name) => name.endsWith(".json"))
              .map((name) => name.replace(".json", "")),
          );
          process.stdout.write(charts.filter((id) => !settled.has(id)).join(" "));
          NODE
          )"
          echo "hats=$hats" >> "$GITHUB_OUTPUT"
          if [ -z "$hats" ]; then
            echo "Every hat already has settled geometry."
          else
            echo "Missing: $hats"
          fi

      - uses: actions/setup-node@v4
        if: steps.missing.outputs.hats != ''
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.missing.outputs.hats != ''

      - name: Build site for settlement
        if: steps.missing.outputs.hats != ''
        run: npm run build

      - name: Install Chromium
        if: steps.missing.outputs.hats != ''
        run: npx playwright install --with-deps chromium

      - name: Settle missing hats
        if: steps.missing.outputs.hats != ''
        run: npm run settle -- ${{ steps.missing.outputs.hats }}

      - name: Commit settled positions
        id: commit
        if: steps.missing.outputs.hats != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hats/settled/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No settled geometry changed."
            exit 0
          fi
          git commit -m "Settle missing hats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not trigger another workflow.
      # Explicitly dispatch the normal Pages workflow against the new branch
      # head so the just-committed settled file is what gets published.
      - name: Deploy the settled source
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"

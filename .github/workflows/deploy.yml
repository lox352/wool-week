name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/shetland-wool-week-tracker-u20lz7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# racing it, but a run already publishing is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The suite checks every chart against the stitch counts its pattern
      # prints, so a misread chart fails here instead of reaching a knitter.
      - name: Test
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so the site does not need
          # to be enabled by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

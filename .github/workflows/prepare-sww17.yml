name: Prepare SWW17 once

on:
  push:
    branches:
      - gpt/sww17-bousta-beanie

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/sww17-bousta-beanie
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Settle Bousta Beanie
        run: npm run settle -- sww17-bousta-beanie
      - name: Commit settled positions
        shell: bash
        run: |
          if git diff --quiet -- src/data/hats/settled/sww17-bousta-beanie.json; then
            echo "Settled geometry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hats/settled/sww17-bousta-beanie.json
          git commit -m "Add settled geometry for Bousta Beanie"
          git push origin HEAD:gpt/sww17-bousta-beanie
